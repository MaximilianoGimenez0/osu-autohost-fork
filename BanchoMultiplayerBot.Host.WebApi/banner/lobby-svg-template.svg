<g transform="translate(15, calc($Y$ + 15))" class="lobby-$ID$">
  <rect width="870" height="200" rx="10" fill="#282830" stroke="#3a3a44" stroke-width="2"/>
  <text x="25" y="45" fill="#ffffff" font-size="20" font-weight="bold" font-family="sans-serif">$NAME$</text>
  <text x="25" y="85" fill="#e0e0e0" font-size="16" font-family="sans-serif">Map: $MAP$</text>
  <text x="25" y="120" fill="#aaaaaa" font-size="14" font-family="sans-serif">Players: $PLAYERS$</text>
  <g transform="translate(25, 140)">
    <rect width="90" height="32" rx="6" class="star-rating-$ID$"/>
    <text x="18" y="21" font-size="14" font-weight="bold" font-family="sans-serif">$SR$ ★</text>
  </g>
  <rect x="25" y="185" width="820" height="6" rx="3" fill="#444450"/>
  <rect x="25" y="185" width="820" height="6" rx="3" fill="#ff66aa" class="duration-$ID$"/>
</g>

